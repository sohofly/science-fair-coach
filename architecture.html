<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>科展小助手｜登入角色與心得歷程架構確認圖</title>
<style>
  :root{color-scheme:light dark;--bg:#f8fafc;--fg:#172033;--muted:#5b6475;--line:#64748b;--neutral:#e2e8f0;--input:#bfdbfe;--process:#c7d2fe;--storage:#99f6e4;--external:#fde68a;--risk:#fecaca;--ok:#dcfce7}
  @media(prefers-color-scheme:dark){:root{--bg:#0f172a;--fg:#e5e7eb;--muted:#a3adbd;--line:#94a3b8;--neutral:#334155;--input:#1d4ed8;--process:#4338ca;--storage:#0f766e;--external:#92400e;--risk:#991b1b;--ok:#166534}}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:1240px;margin:28px auto;padding:0 20px 36px}h1{margin:0 0 6px;font-size:24px}.intro{margin:0 0 20px;color:var(--muted)}svg{width:100%;height:auto;display:block}.zone-title{font-size:17px;font-weight:700;fill:var(--fg)}.label{font-size:14px;font-weight:700;fill:var(--fg)}.small{font-size:12px;fill:var(--muted)}.node{stroke:var(--line);stroke-width:1}.neutral{fill:var(--neutral)}.input{fill:var(--input)}.process{fill:var(--process)}.storage{fill:var(--storage)}.external{fill:var(--external)}.risk{fill:var(--risk)}.ok{fill:var(--ok)}.zone{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:7 5}.edge{stroke:var(--line);stroke-width:1.6;fill:none}.edge-dash{stroke:var(--line);stroke-width:1.4;fill:none;stroke-dasharray:6 5}.edge-label{font-size:11px;fill:var(--muted)}
  .rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:18px}.rules section{border:1px solid var(--line);border-radius:12px;padding:14px;background:color-mix(in srgb,var(--neutral) 45%,transparent)}.rules h2{font-size:15px;margin:0 0 6px}.rules p{margin:0;color:var(--muted)}
</style>
<main>
  <h1>科展小助手：登入角色與心得歷程架構</h1>
  <p class="intro">修改前確認稿｜此圖只定義畫面顯示、角色權限與操作流程，尚未修改正式程式。</p>
  <svg viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
    <title id="title">未登入、學生登入與教師登入三種角色的畫面及心得歷程流程</title>
    <desc id="desc">所有畫面左上角顯示登入電子郵件或未登入。只有學生登入後能繼續上次計畫及填寫心得，教師登入後可選學生查看個別心得。</desc>
    <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--line)"/></marker></defs>

    <rect class="zone" x="20" y="50" width="1160" height="190" rx="16"/>
    <text class="zone-title" x="42" y="80">共用頁首規則</text>
    <rect class="node neutral" x="54" y="105" width="260" height="92" rx="14"/>
    <text class="label" x="184" y="137" text-anchor="middle">科展小助手（身分文字）</text>
    <text class="small" x="184" y="163" text-anchor="middle">已登入：顯示登入 Email</text>
    <text class="small" x="184" y="181" text-anchor="middle">未登入：顯示「未登入」</text>
    <rect class="node risk" x="468" y="105" width="260" height="92" rx="14"/>
    <text class="label" x="598" y="137" text-anchor="middle">禁止顯示</text>
    <text class="small" x="598" y="163" text-anchor="middle">本機使用者／訪客／裝置名稱</text>
    <rect class="node process" x="882" y="105" width="260" height="92" rx="14"/>
    <text class="label" x="1012" y="137" text-anchor="middle">依登入角色切換功能</text>
    <text class="small" x="1012" y="163" text-anchor="middle">未登入／學生／教師各自顯示</text>
    <path class="edge" marker-end="url(#arrow)" d="M314 151H468"/>
    <path class="edge" marker-end="url(#arrow)" d="M728 151H882"/>

    <rect class="zone" x="20" y="270" width="360" height="560" rx="16"/>
    <text class="zone-title" x="42" y="302">未登入</text>
    <rect class="node neutral" x="54" y="330" width="292" height="86" rx="14"/>
    <text class="label" x="200" y="362" text-anchor="middle">頁首：科展小助手（未登入）</text>
    <text class="small" x="200" y="388" text-anchor="middle">提供「登入／班級入口」</text>
    <rect class="node risk" x="54" y="478" width="292" height="112" rx="14"/>
    <text class="label" x="200" y="511" text-anchor="middle">不顯示學生專屬功能</text>
    <text class="small" x="200" y="539" text-anchor="middle">不顯示「繼續上次計畫」</text>
    <text class="small" x="200" y="559" text-anchor="middle">不顯示「心得歷程」填寫入口</text>
    <path class="edge" marker-end="url(#arrow)" d="M200 416V478"/>

    <rect class="zone" x="420" y="270" width="360" height="560" rx="16"/>
    <text class="zone-title" x="442" y="302">學生已登入</text>
    <rect class="node input" x="454" y="330" width="292" height="86" rx="14"/>
    <text class="label" x="600" y="362" text-anchor="middle">頁首：科展小助手（學生 Email）</text>
    <text class="small" x="600" y="388" text-anchor="middle">確認為學生 session 後顯示專屬按鈕</text>
    <rect class="node process" x="454" y="458" width="132" height="86" rx="14"/>
    <text class="label" x="520" y="490" text-anchor="middle">繼續上次計畫</text>
    <text class="small" x="520" y="516" text-anchor="middle">僅學生登入可見</text>
    <rect class="node process" x="614" y="458" width="132" height="86" rx="14"/>
    <text class="label" x="680" y="490" text-anchor="middle">心得歷程</text>
    <text class="small" x="680" y="516" text-anchor="middle">開啟填寫表格</text>
    <rect class="node external" x="454" y="600" width="292" height="144" rx="14"/>
    <text class="label" x="600" y="632" text-anchor="middle">學生心得填寫表格</text>
    <text class="small" x="600" y="660" text-anchor="middle">日期：系統自動帶入（唯讀）</text>
    <text class="small" x="600" y="682" text-anchor="middle">我學到了什麼：多行文字欄位</text>
    <text class="small" x="600" y="704" text-anchor="middle">我覺得困難的地方：多行文字欄位</text>
    <text class="small" x="600" y="726" text-anchor="middle">儲存心得</text>
    <path class="edge" marker-end="url(#arrow)" d="M600 416V438H520V458"/>
    <path class="edge" marker-end="url(#arrow)" d="M600 416V438H680V458"/>
    <path class="edge" marker-end="url(#arrow)" d="M680 544V600"/>

    <rect class="zone" x="820" y="270" width="360" height="560" rx="16"/>
    <text class="zone-title" x="842" y="302">教師已登入</text>
    <rect class="node input" x="854" y="330" width="292" height="86" rx="14"/>
    <text class="label" x="1000" y="362" text-anchor="middle">頁首：科展小助手（教師 Email）</text>
    <text class="small" x="1000" y="388" text-anchor="middle">進入教師檢視／班級管理</text>
    <rect class="node process" x="854" y="458" width="292" height="86" rx="14"/>
    <text class="label" x="1000" y="490" text-anchor="middle">先選班級，再選學生</text>
    <text class="small" x="1000" y="516" text-anchor="middle">學生清單顯示「查看心得」入口</text>
    <rect class="node storage" x="854" y="600" width="292" height="144" rx="14"/>
    <text class="label" x="1000" y="632" text-anchor="middle">個別學生心得歷程</text>
    <text class="small" x="1000" y="660" text-anchor="middle">只顯示目前選取學生</text>
    <text class="small" x="1000" y="682" text-anchor="middle">依日期排列每筆心得</text>
    <text class="small" x="1000" y="704" text-anchor="middle">查看：學到什麼＋困難處</text>
    <text class="small" x="1000" y="726" text-anchor="middle">教師為檢視模式，不代學生填寫</text>
    <path class="edge" marker-end="url(#arrow)" d="M1000 416V458"/>
    <path class="edge" marker-end="url(#arrow)" d="M1000 544V600"/>

    <rect class="node ok" x="340" y="852" width="520" height="42" rx="12"/>
    <text class="label" x="600" y="878" text-anchor="middle">心得資料以學生身分綁定；教師只能查看自己班級中所選學生的紀錄</text>
  </svg>
  <div class="rules">
    <section><h2>身分顯示</h2><p>頁首只接受後端驗證完成的登入 Email。若尚未登入或 session 無效，一律顯示「未登入」。</p></section>
    <section><h2>學生入口</h2><p>「繼續上次計畫」與心得填寫表格都以學生登入狀態為顯示條件，不再由本機資料決定。</p></section>
    <section><h2>教師入口</h2><p>教師端不直接混列所有心得；操作順序固定為選班級／學生，再進入該名學生的個別心得歷程。</p></section>
  </div>
</main>
